name: Build Official Release (APK & AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: 1. دریافت کدهای مخزن
        uses: actions/checkout@v5

      - name: 2. نصب ابزار Bun
        uses: oven-sh/setup-bun@v2

      - name: 3. نصب پکیج‌ها، Capacitor و ابزار آیکون
        run: |
          bun install
          bun add @capacitor/core @capacitor/splash-screen
          bun add -d @capacitor/cli @capacitor/android @capacitor/assets

      - name: 4. تنظیمات آفلاین، ضد زوم و تزریق خودکار فونت وزیرمتن
        run: |
          # تنظیم مسیر نسبی برای اجرای بدون اینترنت
          sed -i "s/defineConfig({/defineConfig({\n  base: '.\/',/g" vite.config.ts || true
          
          # بستن قابلیت زوم و تمام‌صفحه کردن وب
          sed -i 's/<meta name="viewport"[^>]*>/<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" \/>/g' index.html || true
          
          # حذف لینک‌های آنلاین گوگل فونت
          sed -i '/://googleapis.com' index.html || true
          sed -i '/://gstatic.com' index.html || true
          
          # تزریق استایل فونت آفلاین وزیرمتن
          cat << 'EOF' > custom-offline.css
          <style>
            @font-face {
              font-family: 'Vazirmatn';
              src: url('./fonts/Vazirmatn[wght].woff2') format('woff2-variations');
              font-weight: 100 900;
              font-style: normal;
              font-display: swap;
            }
            * {
              font-family: 'Vazirmatn', sans-serif !important;
              -webkit-user-select: none;
              user-select: none;
            }
            input, textarea {
              -webkit-user-select: text !important;
              user-select: text !important;
            }
            html, body {
              overscroll-behavior: none;
              touch-action: pan-x pan-y;
              height: 100vh;
              width: 100vw;
              overflow-x: hidden;
            }
          </style>
          </head>
          EOF
          sed -i -e '/<\/head>/{r custom-offline.css' -e 'd}' index.html

      - name: 5. بیلد گرفتن از نسخه وب
        run: bun run build

      - name: 6. ساخت پروژه اندروید، تنظیمات SDK و تمام‌صفحه هوشمند
        run: |
          npx cap init "گرداننده مافیا" "com.masiha.dialogue" --web-dir=dist
          npx cap add android
          
          # پشتیبانی از اندروید 8 (minSdk 24) و رعایت قانون گوگل پلی (targetSdk 36)
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle || true
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle || true
          
          # تنظیم رفتار کیبورد در AndroidManifest
          sed -i 's/android:windowSoftInputMode="[^"]*"/android:windowSoftInputMode="adjustPan"/g' android/app/src/main/AndroidManifest.xml || true
          
          # بازنویسی MainActivity.java با شنونده کیبورد برای بازگشت فوری به حالت تمام‌صفحه
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")
          cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.masiha.dialogue;

          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewTreeObserver;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemUI();

                  final View decorView = getWindow().getDecorView();
                  
                  decorView.setOnSystemUiVisibilityChangeListener(new View.OnSystemUiVisibilityChangeListener() {
                      @Override
                      public void onSystemUiVisibilityChange(int visibility) {
                          if ((visibility & View.SYSTEM_UI_FLAG_FULLSCREEN) == 0) {
                              hideSystemUI();
                          }
                      }
                  });

                  decorView.getViewTreeObserver().addOnGlobalLayoutListener(new ViewTreeObserver.OnGlobalLayoutListener() {
                      @Override
                      public void onGlobalLayout() {
                          hideSystemUI();
                      }
                  });
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF

          # اعمال آیکون و اسپلش اسکرین
          if [ -d "asset" ]; then
            mkdir -p assets
            cp -r asset/* assets/
            npx capacitor-assets generate --android
          elif [ -d "assets" ]; then
            npx capacitor-assets generate --android
          fi
          
          npx cap sync android

      - name: 7. تنظیم خودکار شماره نسخه، بازیابی کلید امضا و تنظیم Gradle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # افزایش خودکار شماره نسخه بر اساس شماره اجرای گیت‌هاب
          BUILD_NUM=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.$BUILD_NUM\"/g" android/app/build.gradle
          echo "نسخه جدید با کد $BUILD_NUM و نام 1.0.$BUILD_NUM تنظیم شد."

          # بازیابی فایل کلید امضای دیجیتال
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/mafia-release.jks
          
          cat << 'EOF' >> android/app/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file('mafia-release.jks')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

      - name: 8. نصب جاوا (JDK 21) مورد نیاز اندروید
        id: setup-java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 9. ساخت نهایی و امضاشده APK و AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon -Dorg.gradle.java.home=${{ steps.setup-java.outputs.path }}

      - name: 10. آپلود خروجی‌های رسمی برای دانلود
        uses: actions/upload-artifact@v7
        with:
          name: Mafia-Official-Release-v1.0.${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
