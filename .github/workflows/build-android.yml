name: Build Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # امکان اجرای دستی از تب Actions

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. دریافت کدهای مخزن
        uses: actions/checkout@v4

      - name: 2. نصب ابزار Bun
        uses: oven-sh/setup-bun@v1

      - name: 3. نصب پکیج‌ها و افزودن Capacitor
        run: |
          bun install
          bun add @capacitor/core
          bun add -d @capacitor/cli @capacitor/android

      - name: 4. تنظیم مسیر نسبی برای اجرای آفلاین
        run: |
          sed -i "s/defineConfig({/defineConfig({\n  base: '.\/',/g" vite.config.ts || true

      - name: 5. بیلد گرفتن از نسخه وب
        run: bun run build

      - name: 6. ساخت پروژه اندروید و همگام‌سازی فایل‌ها
        run: |
          npx cap init "Mafia Helper" "com.masiha.dialogue" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: 7. نصب جاوا (JDK 21) مورد نیاز اندروید
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 8. ساخت نهایی فایل APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=${{ steps.setup-java.outputs.path }}

      - name: 9. آپلود فایل APK برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: Mafia-Offline-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
