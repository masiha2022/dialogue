name: Build Web App to Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor and Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Dialogue Mafia" "com.masiha.dialogue" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dialogue-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
