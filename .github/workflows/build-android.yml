name: Build Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. دریافت کدهای مخزن
        uses: actions/checkout@v5

      - name: 2. نصب ابزار Bun
        uses: oven-sh/setup-bun@v2

      - name: 3. نصب پکیج‌ها، Capacitor و افزونه تمام‌صفحه
        run: |
          bun install
          bun add @capacitor/core @capacitor/splash-screen @capacitor/status-bar
          bun add -d @capacitor/cli @capacitor/android @capacitor/assets

      - name: 4. غیرفعال کردن زوم و تنظیم مسیر آفلاین
        run: |
          sed -i "s/defineConfig({/defineConfig({\n  base: '.\/',/g" vite.config.ts || true
          # جایگزینی تگ viewport برای بستن زوم و تمام‌صفحه کردن وب
          sed -i 's/<meta name="viewport"[^>]*>/<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" \/>/g' index.html || true

      - name: 5. بیلد گرفتن از نسخه وب
        run: bun run build

      - name: 6. ساخت پروژه اندروید، تمام‌صفحه کردن و اعمال آیکون
        run: |
          npx cap init "Dialogue" "com.masiha.dialogue" --web-dir=dist
          npx cap add android
          
          # پشتیبانی از اندروید 8
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle || true
          
          # فعال‌سازی حالت تمام‌صفحه (Fullscreen) در تم اندروید
          sed -i 's/<\/style>/    <item name="android:windowFullscreen">true<\/item>\n    <\/style>/g' android/app/src/main/res/values/styles.xml || true
          
          # اعمال آیکون و اسپلش اسکرین
          if [ -d "asset" ]; then
            mkdir -p assets
            cp -r asset/* assets/
            npx capacitor-assets generate --android
          elif [ -d "assets" ]; then
            npx capacitor-assets generate --android
          fi
          
          npx cap sync android

      - name: 7. نصب جاوا (JDK 21) مورد نیاز اندروید
        id: setup-java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 8. ساخت نهایی فایل APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=${{ steps.setup-java.outputs.path }}

      - name: 9. آپلود فایل APK برای دانلود
        uses: actions/upload-artifact@v7
        with:
          name: Mafia-Offline-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
