name: Build Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. دریافت کدهای مخزن
        uses: actions/checkout@v5

      - name: 2. نصب ابزار Bun
        uses: oven-sh/setup-bun@v2

      - name: 3. نصب پکیج‌ها، Capacitor و ابزار آیکون
        run: |
          bun install
          bun add @capacitor/core @capacitor/splash-screen
          bun add -d @capacitor/cli @capacitor/android @capacitor/assets

      - name: 4. تنظیم مسیر نسبی برای اجرای آفلاین
        run: |
          sed -i "s/defineConfig({/defineConfig({\n  base: '.\/',/g" vite.config.ts || true

      - name: 5. بیلد گرفتن از نسخه وب
        run: bun run build

      - name: 6. ساخت پروژه اندروید، پشتیبانی اندروید 8 و اعمال آیکون
        run: |
          npx cap init "Dialogue" "com.masiha.dialogue" --web-dir=dist
          npx cap add android
          
          # فعال‌سازی نصب روی اندروید 7 و 8 (تغییر minSdkVersion به 24)
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle || true
          
          # کپی کردن پوشه asset شما به مسیر استاندارد assets برای ساخت آیکون
          if [ -d "asset" ]; then
            mkdir -p assets
            cp -r asset/* assets/
            npx capacitor-assets generate --android
          elif [ -d "assets" ]; then
            npx capacitor-assets generate --android
          fi
          
          npx cap sync android

      - name: 7. نصب جاوا (JDK 21) مورد نیاز اندروید
        id: setup-java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 8. ساخت نهایی فایل APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=${{ steps.setup-java.outputs.path }}

      - name: 9. آپلود فایل APK برای دانلود
        uses: actions/upload-artifact@v7
        with:
          name: Mafia-Offline-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
