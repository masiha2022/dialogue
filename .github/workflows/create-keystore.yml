name: Create Release Keystore

on:
  workflow_dispatch: # فقط وقتی شما دکمه اجرا را بزنید کار می‌کند

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: نصب جاوا
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: ساخت فایل کلید و تبدیل به متن
        run: |
          keytool -genkey -v -keystore mafia-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias mafia-key \
            -storepass "Mafia@2026Pass" \
            -keypass "Mafia@2026Pass" \
            -dname "CN=Masiha, OU=Dev, O=Dialogue, L=Tehran, S=Tehran, C=IR"

          base64 -w 0 mafia-release.jks > keystore_base64.txt

      - name: آپلود فایل‌های کلید برای دانلود
        uses: actions/upload-artifact@v7
        with:
          name: Mafia-Secret-Key
          path: |
            mafia-release.jks
            keystore_base64.txt
